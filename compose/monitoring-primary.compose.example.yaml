services:
  prometheus:
    image: prom/prometheus:REPLACE_WITH_REVIEWED_TAG
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.config.file=/etc/prometheus/web.yml
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION}
    volumes:
      - ${PROMETHEUS_CONFIG_DIRECTORY}:/etc/prometheus:ro
      - prometheus-data:/prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:REPLACE_WITH_REVIEWED_TAG
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - ${GRAFANA_BIND_ADDRESS}:3000:3000
    volumes:
      - ${GRAFANA_CONFIG_DIRECTORY}:/etc/grafana/provisioning:ro
      - ${GRAFANA_DASHBOARD_DIRECTORY}:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on: [prometheus]
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
