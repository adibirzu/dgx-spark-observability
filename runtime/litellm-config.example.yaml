model_list:
  - model_name: qwen3.8-flash-next
    litellm_params:
      model: openai/Qwen3.8-Flash-Next
      api_base: os.environ/VLLM_API_BASE
  - model_name: ollama-local
    litellm_params:
      model: ollama/LOCAL_MODEL_NAME
      api_base: os.environ/OLLAMA_API_BASE
  - model_name: llamacpp-local
    litellm_params:
      model: openai/LOCAL_MODEL_NAME
      api_base: os.environ/LLAMACPP_API_BASE
  - model_name: anthropic-claude
    litellm_params:
      model: anthropic/claude-sonnet-4-5
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/LITELLM_DATABASE_URL
litellm_settings:
  turn_off_message_logging: true
  # Cost tracking per coding harness (https://docs.litellm.ai/docs/tutorials/cost_tracking_coding):
  # LiteLLM >= 1.73 records the incoming User-Agent header as a spend-log tag
  # automatically — no extra config. Each coding CLI (Claude Code, Codex,
  # Gemini CLI, OpenCode, pi, Grok, Kimi, Cursor agent, Cline, Copilot, …)
  # sends its own vendor User-Agent, recorded verbatim, so the Admin UI Logs /
  # Usage dashboard slices cost and active users per tool with zero
  # harness-side changes. Do NOT set
  # litellm_settings.disable_add_user_agent_to_request_tags (it defaults to
  # false; true would turn this tracking off). For per-developer attribution
  # on top, issue one virtual key per developer (user_id set).
  success_callback:
    - langfuse
  model_group_settings:
    forward_client_headers_to_llm_api:
      - anthropic-claude
